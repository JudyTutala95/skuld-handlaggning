spring.application.name=gateway
server.port=8080

spring.threads.virtual.enabled=true

# Var tjänsterna finns. Docker Compose byter till tjänsternas namn i nätverket,
# t.ex. TJANSTER_GALDENAR=http://galdenar-service:8081
tjanster.galdenar=http://localhost:8081
tjanster.arende=http://localhost:8082

# Hälsa för Docker Compose och spårning (OpenTelemetry) genom alla tjänster.
# Export är avstängd lokalt. Docker Compose slår på den och skickar till Jaeger.
management.endpoints.web.exposure.include=health,info
management.tracing.sampling.probability=1.0
management.tracing.export.enabled=false
