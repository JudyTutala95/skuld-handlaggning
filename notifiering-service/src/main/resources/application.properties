spring.application.name=notifiering-service
server.port=8083

spring.threads.virtual.enabled=true

# ---------- Kafka ----------
spring.kafka.bootstrap-servers=localhost:9092
# Spårningen följer med genom Kafka (trace-id i meddelandets headers)
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
# Läs från början av ämnet första gången tjänsten startar, så att inga brev missas
spring.kafka.consumer.auto-offset-reset=earliest

# Hälsa för Docker Compose och spårning (OpenTelemetry) genom alla tjänster.
# Export är avstängd lokalt. Docker Compose slår på den och skickar till Jaeger.
management.endpoints.web.exposure.include=health,info
management.tracing.sampling.probability=1.0
management.tracing.export.enabled=false
