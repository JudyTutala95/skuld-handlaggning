spring.application.name=galdenar-service
server.port=8081

# Virtuella trådar (Java 21+) för Tomcat
spring.threads.virtual.enabled=true

# Egen databas. H2 i minnet när du kör lokalt – Docker Compose byter till PostgreSQL
# med miljövariablerna SPRING_DATASOURCE_URL, _USERNAME och _PASSWORD.
spring.datasource.url=jdbc:h2:mem:galdenar;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Flyway äger schemat. Egen mapp per tjänst, så att migreringarna aldrig blandas ihop.
spring.flyway.locations=classpath:db/migration/galdenar
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true

# Hälsa för Docker Compose och spårning (OpenTelemetry) genom alla tjänster.
# Export är avstängd lokalt. Docker Compose slår på den och skickar till Jaeger.
management.endpoints.web.exposure.include=health,info
management.tracing.sampling.probability=1.0
management.tracing.export.enabled=false
