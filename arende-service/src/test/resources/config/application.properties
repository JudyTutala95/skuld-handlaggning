# Testinställningar. Spring Boot läser config/application.properties EFTER
# application.properties, så värdena här vinner. Filen finns bara i testerna.

# Ingen Kafka i vanliga tester: händelserna sparas i outbox-tabellen men skickas inte.
# KafkaExternaliseringTest slår på det igen och startar en riktig Kafka i Docker.
spring.modulith.events.externalization.enabled=false
spring.kafka.admin.auto-create=false
