spring.application.name=arende-service
server.port=8082

# Virtuella trådar (Java 21+) för Tomcat
spring.threads.virtual.enabled=true

# Egen databas. H2 i minnet när du kör lokalt – Docker Compose byter till PostgreSQL.
spring.datasource.url=jdbc:h2:mem:arende;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.flyway.locations=classpath:db/migration/arende
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true

# ---------- Anrop till gäldenärstjänsten (HTTP Service Client) ----------
spring.http.serviceclient.galdenar.base-url=http://localhost:8081
spring.http.serviceclient.galdenar.connect-timeout=2s
spring.http.serviceclient.galdenar.read-timeout=3s

# ---------- Händelser till Kafka ----------
spring.kafka.bootstrap-servers=localhost:9092
# Spårningen följer med genom Kafka (trace-id i meddelandets headers)
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
# Spring Modulith gör om händelsen till JSON (som bytes) innan den skickas. Kafka ska
# bara skicka bytes vidare – en JSON-serializer här skulle koda dem en gång till.
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
# Outbox: varje händelse sparas i tabellen event_publication i samma transaktion som
# ärendet. Spring Modulith skickar den till Kafka efteråt och markerar den som klar.
spring.modulith.events.jdbc.schema-initialization.enabled=true
spring.modulith.events.republish-outstanding-events-on-restart=true

# Hälsa för Docker Compose och spårning (OpenTelemetry) genom alla tjänster.
# Export är avstängd lokalt. Docker Compose slår på den och skickar till Jaeger.
management.endpoints.web.exposure.include=health,info
management.tracing.sampling.probability=1.0
management.tracing.export.enabled=false
