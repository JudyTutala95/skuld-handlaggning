spring.application.name=skuld-handlaggning

# Virtuella trådar (Java 21+) för Tomcat och @Async
spring.threads.virtual.enabled=true

# H2 in-memory-databas (byt till PostgreSQL i produktion)
spring.datasource.url=jdbc:h2:mem:handlaggning;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Flyway äger schemat, Hibernate kontrollerar bara att det stämmer
spring.jpa.hibernate.ddl-auto=validate
# All databasåtkomst sker i service-lagret, inte i controllers
spring.jpa.open-in-view=false

# Svara med RFC 9457 Problem Details även för Springs egna fel
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health,info
